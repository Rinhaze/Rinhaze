name: Update contribution snake

on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/snake.yml']

permissions:
  contents: write

concurrency:
  group: profile-snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Rinhaze
          outputs: |
            dist/snake.svg?color_snake=#7654c4&color_dots=#ebedf0,#ede6fc,#d2bdf4,#ad88e5,#7654c4
            dist/snake-dark.svg?palette=github-dark&color_snake=#c0a5f5&color_dots=#161b22,#2b223e,#503970,#8963b8,#c0a5f5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Save generated images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/snake.svg dist/snake-dark.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: refresh contribution snake"
          git push
